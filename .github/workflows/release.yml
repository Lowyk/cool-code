name: Release

# Pushing a tag such as v0.2.0 builds the program for each platform and publishes a GitHub release
# with the archives and their checksums.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="harness-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/harness.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/harness" "$name/"
          fi
          cp LICENSE README.md "$name/"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "dist/$name.zip" "$name" > /dev/null
          else
            tar -czf "dist/$name.tar.gz" "$name"
          fi
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum "$name".* > "$name.sha256"
          else
            shasum -a 256 "$name".* > "$name.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
