[package]
name = "coolcode"
version = "0.1.0"
edition = "2024"
description = "Cool Code: an AI coding assistant for your terminal"
license = "MIT"
repository = "https://github.com/Lowyk/cool-code"
readme = "README.md"
keywords = ["ai", "coding", "terminal", "tui", "assistant"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "coolcode"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service"] }
